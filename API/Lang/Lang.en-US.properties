#region Battle Log
LogGainSpBloom=All units gain /c[sp]100 /c[stat]SP/c[white]; both teams gain /c[bloom]100 /c[stat]Bloom

# BuffEffects
# 0 = name, 1 = element name, 2 = old aff, 3 = new aff
# Name's element affinity +5 → +6
LogChangeAff={0} {1} /c[stat]affinity {2} /c[white]→ {3}

# 0 = side ID, 1 = old bloom, 2 = new bloom, 3 = change
# Player/Opponent Team Bloom a → b (+c)
LogChangeBloom={0,plural,=0{Player}=1{Opponent}} team /c[stat]Bloom {1} /c[white]→ {2} /c[white]({3}/c[white])

# ChangeBooleanStat
# 0 = name, 1 = value (0 = false, other = true)
# Name is no longer/now immune to x
LogChangeBooleanStatEffectBlock={0} {1,plural,=0{is no longer}other{is now}} immune to secondary skill effects
LogChangeBooleanStatUnableToActImmune={0} {1,plural,=0{is no longer}other{is now}} immune to becoming unable to act
LogChangeBooleanStatEquipDisabledImmune={0} {1,plural,=0{is no longer}other{is now}} immune to having their equipment disabled

# 2 = SP
# Name's SP a → b
LogChangeBooleanStatInfiniteSp={0} /c[stat]SP /c[sp]{1,plural,=0{∞}other{{2}}} /c[white]→ /c[sp]{1,plural,=0{{2}}other{∞}}

# Name is no longer/now unable to act
LogChangeBooleanStatUnableToAct={0} {1,plural,=0{is no longer}other{is now}} unable to act

# Name's equipment is no longer/now disabled
LogChangeBooleanStatEquipDisabled={0} equipment {1,plural,=0{is no longer}other{is now}} disabled

# 0 = name, 1 = old extra actions, 2 = new extra actions
# Name's Extra Actions a → b
LogChangeExtraActions={0} Extra Actions {1} /c[white]→ {2}

# 0 = name, 1 = old HP, 2 = new HP, 3 = max HP, 4 = change
# Name's HP a → b/c (+d)
LogChangeHp={0} /c[stat]HP {1} /c[white]→ {2}/c[white]//{3} /c[white]({4}/c[white])

# 0 = name, 1 = old SP, 2 = new SP, 3 = change
# Name's SP a → b (+c)
LogChangeSp={0} /c[stat]SP {1} /c[white]→ {2} /c[white]({3}/c[white])

# 0 = name, 1 = mod name, 2 = old mod, 3 = new mod
# Name's mod +a → +b
LogChangeMod={0} {1} {2} /c[white]→ {3}

# 0 = name, 1 = mult name, 2 = old mult, 3 = new mult, 4 = mult change
# Name's mult a% → b% (+c%)
LogChangeMult={0} {1} {2} /c[white]→ {3} /c[white]({4})

# 0 = name, 1 = old shield, 2 = new shield, 3 = max HP, 4 = shield change
# Name's shield a → b/c (+d)
LogChangeShield={0} /c[shield][+vibrating-shield]/c[buff]Shield {1} /c[white]→ {2}/c[white]/{3} /c[white]({4}/c[white])

# 0 = name, 1 = stage name, 2 = old stage, 3 = new stage
# Name's Atk/Def/Fth/Agi Stage +a → +b
LogChangeStageStacks={0} {1} /c[white]Stage {2} /c[white]→ {3}

# 0 = name, 1 = stage name, 2 = old turns, 3 = new turns
# Name's Atk/Def/Fth/Agi Stage turns a → b
LogChangeStageTurns={0} {1} Stage turns {2} /c[white] → {3}

# 0 = name, 1 = stat name, 2 = old stat, 3 = new stat, 4 = default stat, 5 = change
# Name's stat a → b/c (+d)
LogChangeStat={0} {1} {2} /c[white]→ {3}/c[white]//{4} /c[white]({5}/c[white])

# 0 = name, 1 = buff name, 2 = old stacks, 3 = new stacks
# Name's buff stacks a → b
LogGiveBuffStacks={0} {1} /c[white]stacks {2} /c[white]→ {3}

# 0 = name, 1 = buff name, 2 = old turns, 3 = new turns
# Name's buff turns a → b
LogGiveBuffTurns={0} {1} /c[white]turns {2} /c[white]→ {3}

# 0 = name, 1 = buff name, 2 = buff max stacks, 3 = display-formatted stacks, 4 = raw stacks, 5 = display-formatted turns, 6 = raw turns
# Max stacks > 1: Name gains buff with a stacks and b turns
# Max stacks = 1: Name gains buff for b turns
LogGiveBuffGain={0} gains {1} /c[white]{2,plural,=1{for}other{with {3} /c[white]/c[white]{4,plural,=1{stack}other{stacks}} and}} {5} /c[white]{6,plural,=1{turn}other{turns}}

# 0 = name, 1 = max stacks, 2 = display-formatted stacks, 3 = buff name, 4 = raw stacks
# Max stacks > 1: Name loses 3 buff stacks
# Max stacks = 1: Name loses buff
LogLoseBuff={0} /c[white]loses {1,plural,=2{{2} }other{}}{3} {1,plural,=2{{4,plural,=1{stack}other{stacks}}}other{}}

# 0 = name, 1 = stages, 2 = display-formatted stages, 3 = stage name, 4 = stageStatString
# Name loses a Atk/Def/Fth/Agi stage(s) (stageStatString)
LogLoseStage={0} /c[white]loses {2} {3} /c[white]{1,plural,=1{stage}=-1{stage}other{stages}} {4}

# 0 = name, 1 = shield
# Name loses a Shield
LogLoseShield={0} /c[white]loses {1} /c[buff]Shield

# 0 = name, 1 = old turns, 2 = new turns
# Name's Shield turns a → b
LogShieldTurns={0} /c[buff]Shield /c[white]turns {1} /c[white]→ {2}

# 0 = stat name, 1 = old stat, 2 = new stat, 3 = base stat, 4 = change
# stat a → b/c (+d)
LogStageStat={0} {1} /c[white]→ {2}/c[white]/{3} /c[white]({4}/c[white])

# 0 = name, 1 = buff/passive name
# Name's buff/passive:
LogTurnEndEffect={0} {1}/c[white]:

# Used for Buffs, Shields, and Stages
# 0 = old turns, 1 = new turns
# , turns a → b
LogTurnsNameless=/c[white], turns {0} /c[white] → {1}

# Skill use
# 0 = name, 1 = skill name, 2 = target name, 3 = isRangeSelf (0 = false, other = true), 4 = LogSkillUseChangeSpBloom
# Name uses skill on name (SP/Bloom a → b (+c))
LogSkillUse={0} /c[white]uses {1} /c[white]{3,plural,=0{on {2} }other{}}{4}

# 0 = isBloom (0 = false, other = true), 1 = old SP/Bloom, 2 = new SP/Bloom, 3 = SP/Bloom change
# (SP a → b (+c))
LogSkillUseChangeSpBloom=/c[white] (/c[stat]{0,plural,=0{SP}other{Bloom}} {1} /c[white]→ {2} /c[white]({3}/c[white]))

# 0 = name
# No effect on Name
LogNoEffect=/c[neg]No effect /c[white]on {0}

# 0 = name, 1 = skill name
# Name tries to use skill
