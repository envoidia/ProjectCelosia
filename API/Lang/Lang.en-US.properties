# 0 = LogTriesToUse1 and 2, 1 = LogButIsUnableToAct
# Name tries to use skill on Name, but is unable to act
LogSkillFailUnableToAct={0}/c[white]{1}

# 0 = cooldown
# , but it's on cooldown (a turns)
LogButItsOnCooldown=, but it's on cooldown (/c[cooldown]{0} {0,plural,=1{turn}other{turns}}/c[white])

# 0 = log.tries_to_use.1 and 2, 1 = log.but_its_on_cooldown
# Name tries to use skill on Name, but it's on cooldown (a turns)
LogSkillFailCooldown={0}/c[white]{1}

LogButCantReach=, but can't reach

# 0 = LogTriesToUse1 and 2, 1 = LogButCantReach
# Name tries to use skill on Name, but can't reach
LogSkillFailRange={0}/c[white]{1}

# 0 = isBloom (0 = false, other = true)
# , but doesn't have enough SP/Bloom
LogButDoesntHaveEnough=, but doesn't have enough /c[#{0,plural,=0{bb00ff]SP}other{ff00ff]Bloom}}

# 0 = LogTriesToUse1 and 2, 1 = LogButDoesntHaveEnough
